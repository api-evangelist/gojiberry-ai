      - phoneEnriched
      - enrichingEmail
      - enrichingPhone
      - userId
      - user
      - readyForCampaign
      - hasStartedCampaign
      - createdAt
      - updatedAt
    AddContactSignalDto:
      type: object
      properties:
        intent:
          type: string
          description: Human-readable description of what the lead did, as it should appear on the contact
          example: Booked a demo from the pricing page
        intentType:
          type: string
          description: Leave empty for first-party signals. Only set it to record one of the signal types detected by Gojiberry agents.
          enum:
          - SEARCH_KEYWORD
          - SEARCH_KEYWORD_COMMENT
          - SEARCH_KEYWORD_LIKE
          - SEARCH_KEYWORD_POST
          - EVENT_KEYWORD
          - GROUP_KEYWORD
          - COMPETITOR_PAGE_URL
          - INFLUENCER_PAGE_URL
          - YOUR_COMPANY
          - RECENT_ACTIVITY
          - RECENTLY_CHANGED_JOB
          - RECENT_FUNDING_EVENT
          - VISITED_PROFILE
          - YOUR_PROFILE
          - YOUR_COMPANY_FOLLOWERS
          - JOB_SEARCH
          - HIRING
          - HIRING_SURGE
          - TECHNOLOGY
          - NEW_DECISION_MAKER
          - LOOKALIKE
          - WEBSITE_VISITOR
        intentKeyword:
          type: string
          description: Short label for the signal, e.g. trial_signup, demo_booked or webinar_attended
          example: demo_booked
          maxLength: 255
    Account:
      type: object
      properties: {}
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Enter API Key
