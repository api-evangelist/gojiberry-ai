aid: gojiberry-ai
name: Gojiberry AI
description: >-
  Gojiberry AI is a Y Combinator-backed (P26), EU-hosted AI sales development
  platform that turns a company website into an autonomous go-to-market agent.
  The agent detects buying and social intent signals, scores prospects against
  an ideal customer profile, builds warm-lead lists, and runs multichannel
  (email and LinkedIn) outreach automatically. Gojiberry exposes a REST External
  API at ext.gojiberry.ai for programmatic access to contacts, campaigns, lists,
  lead-source agents, and the unified LinkedIn/email inbox (Unibox), plus a
  hosted Model Context Protocol (MCP) server so agents like Claude can run
  outreach and pull pipeline insights conversationally. Trusted by 2,000+ sales
  and GTM teams worldwide.
