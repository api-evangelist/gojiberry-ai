note: >-
  Two surfaces are assessed separately: the REST External API (bearer API key,
  no OAuth) and the hosted MCP server (OAuth 2.1 + PKCE + dynamic client
  registration, with both RFC 8414 and RFC 9728 metadata served anonymously).
  Gojiberry publishes no formal compliance certifications — no SOC 2, ISO 27001,
  PCI DSS, HIPAA or FedRAMP claim and no trust center was found (probed
  2026-08-13) — so NO Compliance pointer is emitted. The product does advertise
  "Made & Hosted in the EU" and ships GDPR machinery in-product (a global
  do-not-contact "red list" field on Contact, an Opt-out & Privacy Request page),
  which is a posture, not a certification.
